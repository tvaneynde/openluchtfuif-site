# Supabase project config.
#
# This file exists for exactly one reason: verify_jwt is a property of the
# *deployed* function, not of the source. It used to be set once by hand with
# `supabase functions deploy mollie-webhook --no-verify-jwt`, and nothing in the
# repo recorded that. The deploy in commit bb41dda (2026-07-27) left the flag
# off the command line, so mollie-webhook silently went back to the default
# (true) and started answering Mollie's callback with
# 401 UNAUTHORIZED_NO_AUTH_HEADER. Payments kept succeeding at Mollie while
# confirm_payment never ran, so every order sat at awaiting_payment until
# expire_old_orders swept it to expired — no tickets, no email, for five days.
#
# With this file checked in, `supabase functions deploy` reads the flag from
# here and the setting survives every future deploy. Keep every function listed
# explicitly, including the `true` ones: an absent entry is what caused the
# outage in the first place.

project_id = "noihnuouftyvsvzybwer"

# ---- Mollie's payment callback ----
# Mollie is a third-party server. It has no Supabase session and sends no
# Authorization header, so JWT verification MUST stay off or the webhook is
# unreachable. This is not a security hole: the handler ignores the request body
# and re-fetches the payment from the Mollie API before trusting anything.
[functions.mollie-webhook]
verify_jwt = false

# ---- Opened as a plain link ----
# download-ticket is reached with <a href> — the "PDF" button in the dashboard's
# free-tickets list and the "Download tickets" button on the public thank-you
# page. A browser navigation sends no apikey and no Authorization header, so the
# gateway answers UNAUTHORIZED_NO_AUTH_HEADER and the user sees raw JSON in a
# new tab instead of their ticket. It must stay false for the same reason as the
# webhook: nothing is there to attach a header.
#
# The trade-off is deliberate and pre-existing: the endpoint is keyed only on
# order_id, so anyone holding that UUID can fetch the PDF. Order ids are v4
# UUIDs and can no longer be enumerated (migration 000023 closed that leak), so
# knowing one is itself reasonable evidence of having placed the order.
[functions.download-ticket]
verify_jwt = false

# ---- Browser-called functions ----
# These are reached from the site or the dashboard by code that sets headers:
# supabase-js functions.invoke() attaches Authorization, and the hand-rolled
# fetch() calls in Checkout.jsx / Scanner.jsx send apikey. Either one satisfies
# the gateway — apikey alone is enough; it is specifically the *header-less*
# request that gets rejected.
#
# Note that verify_jwt = true is NOT an authorization check — the anon key is
# bundled in the public JS build and is itself a valid JWT. Any function that
# must be admin-only enforces that itself by calling auth.getUser() on the
# caller's token (see reconcile-payments); scan and scanner-cache use the
# X-Scanner-Key PIN.

[functions.create-payment]
verify_jwt = true

[functions.scan]
verify_jwt = true

[functions.scanner-cache]
verify_jwt = true

[functions.process-email-queue]
verify_jwt = true

[functions.send-abandoned-reminders]
verify_jwt = true

[functions.reconcile-payments]
verify_jwt = true
